apiVersion: apps/v1
kind: Deployment
metadata:
  name: claimsight-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claimsight-web
  template:
    metadata:
      labels:
        app: claimsight-web
    spec:
      containers:
        - name: web
          image: claimsight-web:local
          ports:
            - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: claimsight-web
spec:
  selector:
    app: claimsight-web
  ports:
    - port: 80
      targetPort: 5173
