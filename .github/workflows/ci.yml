name: eval-gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Eval harness
        env:
          CLAIMSIGHT_LLM_PROVIDER: deterministic
          CLAIMSIGHT_FORCE_MEMORY: "1"
          DATABASE_URL: sqlite+pysqlite:///./claimsight-ci.db
        run: pytest -q
